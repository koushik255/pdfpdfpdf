<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>PDF Viewer Prototype</title>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <div id="sidebar">
      <button id="collapse-btn" title="Toggle Sidebar">&laquo;</button>
      <h3>Controls</h3>
      
      <div class="sidebar-item">
        <label for="page-num">Page:</label>
        <div style="display: flex; align-items: center; gap: 5px;">
          <input type="number" id="page-num" value="1" min="1" />
          <span id="page-count">/ ?</span>
        </div>
      </div>

      <div class="sidebar-item">
        <label for="zoom-range">Zoom: <span id="zoom-val">1.5x</span></label>
        <input type="range" id="zoom-range" min="0.5" max="3.0" step="0.1" value="1.5" />
      </div>
    </div>
    
    <div id="resizer"></div>

    <div id="main-content">
      <div id="loading-msg">Loading PDF...</div>
      <div id="pdf-container">
        <div id="pdf-wrapper">
          <canvas id="pdf-render"></canvas>
          <div id="text-layer" class="textLayer"></div>
        </div>
      </div>
    </div>

    <div id="resizer-right"></div>
    <div id="sidebar-right">
      <button id="collapse-btn-right" title="Toggle Notes">&raquo;</button>
      <h3>Notes</h3>
      <textarea id="notes-area" placeholder="Type your notes here..."></textarea>
    </div>

    <!-- Load local pdf.js from node_modules as module (legacy version with polyfills) -->
    <script type="module">
      import * as pdfjsLib from './node_modules/pdfjs-dist/legacy/build/pdf.mjs';
      pdfjsLib.GlobalWorkerOptions.workerSrc = './node_modules/pdfjs-dist/legacy/build/pdf.worker.mjs';
      window.pdfjsLib = pdfjsLib;
    </script>
    <!-- Load our compiled renderer logic -->
    <script src="dist/renderer.js"></script>
  </body>
</html>
